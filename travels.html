<!doctype html>
<html lang="en" class="no-globe">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071020">
<title>Travels · So Yeon Kim</title>
<meta name="description" content="Travels: photographs by So Yeon Kim from Helsinki, Tallinn, Prague, Linz, Budapest, München, Zürich, Geneva and Les Houches.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23071020'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff9a4c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..600&display=swap">
<style>
/* Travels: the same night-blue world as the main page, without the landscape. Under the title, a journey: a 3D
   globe and the nine photographs as one column of steps, about a screen each. Scrolling flies a small plane
   from Korea along great circles to each photo's place in turn: it reaches a city when that photo's centre
   crosses the middle of the screen, the globe turns to keep it near the centre and zooms in for the short
   European legs. Desktop: the globe sticks on the left under the masthead, the photos scroll on the right.
   Phones and portrait tablets: the globe sticks in a band under the masthead and the photos scroll below it.
   Without JS or without d3 the globe is hidden and the photos form a plain grid (3 / 2 / 1 columns, the
   middle column a little lower). Click a photo to open it full size in a native <dialog> viewer. Each photo is
   captioned with the place as on the old site plus its city-centre latitude/longitude.
   Globe: orthographic, drawn on a canvas with d3-geo (pinned, from jsDelivr); outlines are Natural Earth 1:50m
   in assets/globe-data.js, written by tools/make_globe_data.py. */
:root{
  color-scheme: dark;
  --ink:#071020;          /* night-blue ground */
  --ink-2:#0b1628;        /* reading panels */
  --line:#1f314c;         /* hairlines */
  --pearl:#e9eef5;        /* text, S1 sheet */
  --mist:#93a7c0;         /* secondary text */
  --faint:#62789a;        /* hairlines, dots, axis lines (not for text) */
  --faint-text:#7d93b2;   /* tertiary text: >= 4.5:1 on ink, ink-2 and dusk */
  --cyan:#7ad8f6;         /* S0 high energy */
  --deep:#0b4a9c;         /* S0 wells */
  --dusk:#172a4b;         /* horizon */
  --glow:#ff9a4c;         /* the wavepacket */
  --glow-core:#fff0dc;    /* hot centre of the packet */
  --coh:#ffe1a6;          /* coherence shimmer */
  --photon:#e8352d;       /* h-nu arrow */
  --spin-up:#8f88ff;      /* spin up, blue-violet */
  --spin-down:#ff9a4c;    /* spin down, orange */
  --bubble:#fbfaf6;
  --bubble-ink:#141b27;
  --shadow:rgba(2,6,14,.45);
  --veil:rgba(7,16,32,.86);
  --hud-bg:rgba(7,16,32,.84);
  --cyan-haze:rgba(122,216,246,.16);
  --glow-haze:rgba(255,154,76,.24);
  --focus:#ffc48f;
  --select:#d3dae4;       /* text selection: light grey */

  --font-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --s-1:clamp(.72rem,.69rem + .14vw,.8rem);
  --s0:clamp(1rem,.95rem + .22vw,1.125rem);
  --s1:clamp(1.15rem,1.04rem + .5vw,1.45rem);
  --s2:clamp(1.95rem,1.3rem + 2.5vw,3.3rem);
  --s3:clamp(3.1rem,1.6rem + 6.4vw,7rem);

  --gx:clamp(16px,5.5vw,88px);

  /* page-only tokens */
  --viewer-bg:#050b17;     /* opaque: nothing of the page shows through behind the photo */
  --viewer-backdrop:rgba(2,6,14,.6);
  --btn-bg:rgba(11,22,40,.72);
  --frame-rim:rgba(233,238,245,.07);
  --col-gap:clamp(20px,2.6vw,40px);
  --stagger:0px;
  --content-max:77rem;
  --mast-h:88px;           /* sticky masthead + its fade: in-page jumps stop below it */
  --pad:var(--gx);         /* the page's side padding */

  /* globe tokens (most are read by the script that draws the globe) */
  --coast:rgba(122,216,246,.34);  /* cyan-tinted coastline hairline */
  --tip-bg:rgba(7,16,32,.94);     /* the place label on the globe */
  --ocean:#0a1a31;         /* the sphere: a step lighter than the page */
  --ocean-lit:#11264a;     /* its lit side (upper left) */
  --globe-land:#16304f;    /* land: navy, a step lighter than the ocean */
  --atmo:rgba(122,216,246,.2);    /* soft rim glow around the sphere */
  --globe-border:rgba(147,167,192,.34);  /* country borders: faint hairlines */
  --graticule:rgba(147,167,192,.07);
  --route-rest:rgba(233,238,245,.32);  /* the part of the route still to fly */
  --vh100:100vh;
  --stick-top:62px;        /* the masthead's height: the globe sticks right under it (set exactly by the script) */
}
@supports (height:100svh){:root{--vh100:100svh}}
[hidden]{display:none!important}
html{overflow-x:clip;background:var(--ink);scrollbar-gutter:stable;scroll-padding-top:var(--mast-h)}
html:has(dialog[open]){overflow:hidden}
body{margin:0;background:var(--ink);color:var(--pearl);font-family:var(--font-body);font-size:var(--s0);
  line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip;
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit;text-decoration-color:var(--faint);text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{text-decoration-color:var(--glow)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
::selection{background:var(--select);color:var(--ink)}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap}

.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 40% at 24% 104%, var(--cyan-haze), transparent 70%),
    linear-gradient(180deg, var(--ink) 0%, var(--ink) 40%, var(--dusk) 160%)}

.skip{position:absolute;left:16px;top:-200px;z-index:20;background:var(--glow);color:var(--ink);
  font:500 .78rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;
  text-decoration:none;border-radius:2px}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}

/* ---------- masthead (same look as index.html; sticky on an ink ground) ---------- */
.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;flex-wrap:wrap;align-items:baseline;
  justify-content:space-between;gap:6px 20px;padding:18px var(--gx) 16px;background:var(--ink);
  box-shadow:0 calc(-1 * env(safe-area-inset-top,0px)) 0 0 var(--ink)}
.masthead::after{content:"";position:absolute;left:0;right:0;top:100%;height:22px;pointer-events:none;
  background:linear-gradient(180deg,var(--ink) 0%,transparent 100%)}
.brand{font-family:var(--font-display);font-style:italic;font-weight:700;font-stretch:87.5%;font-size:1.06rem;
  letter-spacing:-.005em;text-decoration:none;color:var(--pearl)}
.quick{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--font-display);font-weight:500;font-size:.84rem;
  letter-spacing:.02em}
.quick a{text-decoration:none;color:var(--mist);padding:4px 0;border-bottom:1px solid transparent}
.quick a:hover,.quick a[aria-current="page"]{color:var(--pearl);border-bottom-color:var(--glow)}
/* Travels and LaTex for CBNU are separate pages: a hairline sets them apart from the main-page links */
.quick a:not(.page) + a.page{position:relative;margin-left:10px}
.quick a:not(.page) + a.page::before{content:"";position:absolute;left:-14px;top:50%;width:1px;height:.95em;
  transform:translateY(-50%);background:var(--line)}

/* ---------- page ---------- */
.wrap{position:relative;z-index:1;width:100%;padding-inline:var(--pad);box-sizing:border-box}
/* left edge = the masthead's edge (as on index.html); blocks stop at --content-max on wide screens */
.wrap > *{max-width:var(--content-max)}
main.wrap{flex:1 0 auto}
.intro{padding:clamp(44px,10vh,120px) 0 clamp(22px,3.4vh,36px);border-bottom:1px solid var(--line)}
h1{font-family:var(--font-display);font-style:italic;font-weight:800;font-stretch:87.5%;font-size:var(--s3);
  letter-spacing:-.025em;line-height:.92;margin:0;color:var(--pearl)}

/* ---------- photos (the plain grid without the globe; steps beside the globe below) ---------- */
.grid{list-style:none;margin:0;padding:clamp(32px,6vh,64px) 0 var(--stagger);display:grid;
  grid-template-columns:minmax(0,1fr);gap:clamp(40px,5vw,72px) var(--col-gap)}
.grid:focus{outline:none}
.grid > li{min-width:0;scroll-margin-block:16px}
.grid > li:focus{outline:none}
.grid > li:focus-visible .frame{outline:2px solid var(--focus);outline-offset:4px}
.shot{margin:0}
.frame{display:block;position:relative;overflow:hidden;aspect-ratio:1 / 1;background:var(--ink-2);border-radius:2px;
  color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.frame img{display:block;width:100%;height:100%;max-width:100%;object-fit:cover;
  filter:saturate(.94) brightness(.95);transition:transform .7s cubic-bezier(.2,.7,.2,1),filter .4s}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px var(--frame-rim);transition:box-shadow .3s}
.frame:hover img{transform:scale(1.03);filter:none}
.frame:hover::after{box-shadow:inset 0 0 0 1px var(--glow)}
.frame:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.frame .view{position:absolute;right:10px;bottom:10px;z-index:1;font:500 .64rem/1 var(--font-mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--pearl);background:var(--hud-bg);padding:6px 8px;border-radius:2px;
  opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.frame:hover .view,.frame:focus-visible .view{opacity:1;transform:none}
@media (hover:none){.frame .view{opacity:.9;transform:none}}

.shot figcaption{margin-top:.9rem}
.place{display:block;line-height:1.2}
.city{font-family:var(--font-display);font-style:italic;font-weight:700;font-stretch:87.5%;font-size:var(--s1);
  letter-spacing:-.005em;color:var(--pearl)}
.country{font-family:var(--font-mono);font-size:.76rem;letter-spacing:.04em;color:var(--mist);white-space:nowrap}
.data{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-top:.55rem;padding-top:.5rem;
  border-top:1px solid var(--line);font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;line-height:1.4}
.coord{color:var(--faint-text)}
.no{color:var(--glow);letter-spacing:.08em}
/* the photo whose place the plane is at */
.grid > li.is-current .frame img{filter:none}
.grid > li.is-current .no{color:var(--glow-core);text-shadow:0 0 8px var(--glow)}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;margin-top:clamp(64px,10vh,120px);
  padding-top:1rem;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px);border-top:1px solid var(--line);
  font-family:var(--font-mono);font-size:.72rem;color:var(--mist)}
.foot a{color:var(--mist);text-decoration:none}
.foot a:hover{color:var(--pearl);text-decoration:underline;text-decoration-color:var(--glow)}

/* ---------- journey: the globe beside the photo steps (only with JS and d3; see the script) ---------- */
.globe{display:none}
.globe-on .journey{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);column-gap:clamp(28px,4.5vw,80px);
  --step-h:calc(var(--vh100) - var(--stick-top));   /* one photo step: the screen under the masthead */
  --cap-h:132px;                                     /* caption + breathing room under each photo */
  --lead:calc(var(--step-h) * 1.5)}                  /* the long first flight, Korea -> photo 01 */
.globe-on .globe{display:block;position:relative;min-width:0}
.globe-stick{position:sticky;top:var(--stick-top);height:var(--step-h)}
.globe-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;opacity:0}
.globe.is-ready .globe-canvas{opacity:1}
/* the place the plane is at (or heading for): number and caption as under its photo, moved by the script */
.globe-tag{position:absolute;left:0;top:0;z-index:2;margin:0;display:flex;align-items:baseline;gap:.5em;
  padding:5px 8px 6px;background:var(--tip-bg);border:1px solid var(--line);border-radius:2px;line-height:1;
  white-space:nowrap;pointer-events:none;visibility:hidden}
.globe-tag.is-on{visibility:visible}
.gt-n{font:500 .66rem/1 var(--font-mono);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--glow)}
.gt-n:empty{display:none}
.gt-city{font-family:var(--font-display);font-style:italic;font-weight:700;font-stretch:87.5%;font-size:.95rem;
  color:var(--pearl)}
.gt-country{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.04em;color:var(--mist)}
.credit{position:absolute;right:0;bottom:12px;z-index:1;margin:0;font-family:var(--font-mono);font-size:.64rem;
  letter-spacing:.06em;line-height:1.2;color:var(--mist);
  text-shadow:0 0 3px var(--ink),0 0 3px var(--ink),0 0 1px var(--ink)}

.globe-on .grid{display:block;margin:0;padding:0}
.globe-on .grid > li{display:flex;align-items:center;justify-content:center;min-height:var(--step-h);
  box-sizing:border-box;padding-block:12px}
/* photo 01's step also holds the long first flight: the photo waits at the bottom of the screen with its top
   edge showing (the script sets --hold from its height), then rises into place as the plane nears Helsinki */
.globe-on .grid > li:first-child{flex-direction:column;justify-content:flex-start;
  min-height:calc(var(--lead) + var(--step-h))}
.globe-on .grid > li:first-child::before{content:"";flex:1 0 var(--lead)}
.globe-on .grid > li:first-child::after{content:"";flex:1 0 0px}
.globe-on .grid > li:first-child .shot{position:sticky;bottom:var(--hold,-100000px)}
.globe-on .shot{width:min(100%, calc(var(--step-h) - var(--cap-h)))}
.globe-on .frame{scroll-margin-block:16px var(--cap-h)}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;
  box-sizing:border-box;background:var(--viewer-bg);color:var(--pearl);overflow:hidden;font-family:var(--font-body);
  --chrome:184px}
.viewer::backdrop{background:var(--viewer-backdrop)}
.viewer[open]{display:grid;grid-template-columns:clamp(60px,7vw,104px) minmax(0,1fr) clamp(60px,7vw,104px);
  grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar bar bar" "prev stage next";
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px)
          calc(env(safe-area-inset-bottom,0px) + 20px) calc(env(safe-area-inset-left,0px) + 12px)}
.v-bar{grid-area:bar;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:10px}
.v-count{margin:0;padding-left:6px;font-family:var(--font-mono);font-size:.78rem;letter-spacing:.12em;color:var(--mist);
  font-variant-numeric:tabular-nums}
.v-count b{font-weight:500;color:var(--pearl)}
.v-stage{grid-area:stage;margin:0;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px}
.v-stage img{display:block;max-width:100%;height:auto;background:var(--ink-2);border-radius:2px;
  width:min(100%, calc((100vh - var(--chrome)) * var(--ar,1)), var(--nw,1280px));
  width:min(100%, calc((100dvh - var(--chrome)) * var(--ar,1)), var(--nw,1280px))}
.v-cap{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:.25rem 1.1rem;text-align:center;
  max-width:100%}
.v-cap .place{display:inline}
.v-cap .coord{color:var(--faint-text)}
.v-cap .coord{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.v-btn{all:unset;box-sizing:border-box;cursor:pointer;width:46px;height:46px;display:inline-grid;place-items:center;
  border:1px solid var(--line);border-radius:2px;color:var(--pearl);background:var(--btn-bg);
  transition:border-color .2s,color .2s}
.v-btn svg{width:18px;height:18px;display:block}
.v-btn:hover{border-color:var(--glow);color:var(--glow)}
.v-btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.v-prev{grid-area:prev;place-self:center}
.v-next{grid-area:next;place-self:center}

@media (prefers-reduced-motion: no-preference){
  .viewer[open]{animation:v-in .22s ease-out}
  .v-stage img.is-in{animation:v-img .3s ease-out}
  @keyframes v-in{from{opacity:0}to{opacity:1}}
  @keyframes v-img{from{opacity:.15}to{opacity:1}}
  .globe-canvas{transition:opacity .6s ease-out}
}
@media (prefers-reduced-motion: reduce){
  .frame img,.frame::after,.frame .view,.v-btn{transition:none}
  .frame:hover img{transform:none}
}

/* ---------- tablets / desktop ---------- */
@media (min-width:560px){
  .no-globe .grid{grid-template-columns:repeat(2,minmax(0,1fr));--stagger:clamp(32px,6vw,64px)}
  .no-globe .grid > li:nth-child(2n){transform:translateY(var(--stagger))}
}
@media (min-width:960px){
  .no-globe .grid{grid-template-columns:repeat(3,minmax(0,1fr));--stagger:clamp(48px,5vw,88px)}
  .no-globe .grid > li:nth-child(2n){transform:none}
  .no-globe .grid > li:nth-child(3n+2){transform:translateY(var(--stagger))}
}
/* landscape tablets: globe and photos in two equal columns */
@media (min-width:720px) and (max-width:959px) and (orientation:landscape){
  .globe-on .journey{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px}
}
/* phones and portrait tablets: the globe sticks in a band under the masthead, the photos scroll below it.
   Each step is the screen left under the band, so a centred photo is never behind it (on short screens the
   photo keeps at least 56% of the width and may pass a little under the band). Screens too short for the
   band (phones held sideways) keep the plain grid: the script only turns the globe on when it fits. */
@media (max-width:719px), (max-width:959px) and (orientation:portrait){
  .globe-on .journey{display:block;--band-h:clamp(160px,calc(var(--vh100) * .34),460px);
    --step-h:calc(var(--vh100) - var(--stick-top) - var(--band-h));--cap-h:100px;--lead:calc(var(--step-h) * 1.4)}
  .globe-on .globe{position:sticky;top:var(--stick-top);z-index:4;height:var(--band-h);
    margin-inline:calc(-1 * var(--pad));background:var(--ink)}
  .globe-on .globe::after{content:"";position:absolute;left:0;right:0;top:100%;height:48px;pointer-events:none;
    background:linear-gradient(180deg,var(--ink) 0%,rgba(7,16,32,.6) 40%,transparent 100%)}
  /* the night sky stays ink a little lower, so the band's lower edge does not show against it */
  .globe-on .backdrop{background:
    radial-gradient(60% 40% at 24% 104%, var(--cyan-haze), transparent 70%),
    linear-gradient(180deg, var(--ink) 0%, var(--ink) 56%, var(--dusk) 176%)}
  .globe-on .shot{width:max(min(100%, 56vw), min(100%, calc(var(--step-h) - var(--cap-h))))}
  .globe-stick{position:absolute;inset:0;height:auto}
  .credit{right:var(--pad);bottom:8px}
  .globe-on .grid{scroll-margin-top:var(--band-h)}
  .globe-on .grid > li{scroll-margin-top:calc(var(--band-h) + 16px)}
  .globe-on .frame{scroll-margin-block:calc(var(--band-h) + 16px) var(--cap-h)}
}

/* ---------- phones ---------- */
@media (max-width:719px){
  :root{--mast-h:100px;--pad:16px;--stick-top:92px}
  .masthead{padding:12px 16px 10px;gap:4px 12px}
  /* the links share the brand's line and wrap to a second, right-aligned line */
  .quick{flex:1 1 0;min-width:0;justify-content:flex-end;gap:0 12px;font-size:.8rem}
  .quick a:not(.page) + a.page{margin-left:0}
  .quick a:not(.page) + a.page::before{display:none}
  .intro{padding-top:40px}
  .gt-city{font-size:.88rem}
  .gt-n,.gt-country{font-size:.62rem}
  .globe-tag{padding:4px 7px 5px}

  .viewer{--chrome:236px}
  .viewer[open]{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"bar bar" "stage stage" "prev next";
    padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 16px)
            calc(env(safe-area-inset-bottom,0px) + 16px) calc(env(safe-area-inset-left,0px) + 16px)}
  .v-count{padding-left:0}
  .v-prev{justify-self:start;margin-top:12px}
  .v-next{justify-self:end;margin-top:12px}
}
/* narrow phones (320-359 px): smaller links keep the masthead at two rows */
@media (max-width:359px){
  .quick{gap:0 10px;font-size:.74rem}
  .brand{font-size:.98rem}
}
</style>
<script>/* the globe needs room: on short screens (e.g. phones held sideways) the photos stay a plain grid;
   the globe script repeats this query and switches when the screen turns */

<script>
/* Viewer: a click on a photo opens it full size in a native modal <dialog>. Without JS (or without
   dialog support) the links simply open the full-size image file. */
(function () {
  'use strict';
  var dlg = document.getElementById('viewer');
  if (!dlg || typeof dlg.showModal !== 'function') return;

  var links = Array.prototype.slice.call(document.querySelectorAll('.grid .frame'));
  var img = document.getElementById('v-img');
  var stage = document.getElementById('v-stage');
  var elN = document.getElementById('v-n');
  var elTitle = document.getElementById('v-title');
  var elLive = document.getElementById('v-live');
  var elCity = document.getElementById('v-city');
  var elCountry = document.getElementById('v-country');
  var elCoord = document.getElementById('v-coord');
  var btnClose = document.getElementById('v-close');
  var total = links.length;
  var cur = 0;
  var preloaded = {};

  document.getElementById('v-total').textContent = String(total);

  var items = links.map(function (a) {
    var fig = a.closest('figure');
    var thumb = a.querySelector('img');
    var city = fig.querySelector('.city').textContent;
    var country = fig.querySelector('.country').textContent;
    return {
      link: a,
      thumb: thumb,
      full: a.getAttribute('href'),
      w: Number(a.getAttribute('data-w')) || 1280,
      h: Number(a.getAttribute('data-h')) || 1280,
      alt: thumb.getAttribute('alt') || '',
      city: city,
      country: country,
      place: city + ' ' + country,
      coord: fig.querySelector('.coord').textContent
    };
  });

  function preload(i) {
    var it = items[(i + total) % total];
    if (preloaded[it.full]) return;
    preloaded[it.full] = true;
    var pre = new Image();
    pre.decoding = 'async';
    pre.src = it.full;
  }

  function show(i, announce) {
    cur = (i + total) % total;
    var it = items[cur];
    img.classList.remove('is-in');
    void img.offsetWidth; // restart the fade
    img.classList.add('is-in');
    img.width = it.w;
    img.height = it.h;
    img.style.setProperty('--ar', String(it.w / it.h));
    img.style.setProperty('--nw', it.w + 'px');
    img.alt = it.alt;

    // Show whatever the grid already loaded at once, then swap in the full-size file when it has arrived.
    var shown = it.thumb.currentSrc || '';
    if (shown && shown.indexOf(it.full) === -1 && it.thumb.complete) {
      img.src = shown;
      var hi = new Image();
      hi.decoding = 'async';
      hi.onload = function () { if (items[cur] === it) img.src = it.full; };
      hi.src = it.full;
      preloaded[it.full] = true;
    } else {
      img.src = it.full;
      preloaded[it.full] = true;
    }

    elCity.textContent = it.city;
    elCountry.textContent = it.country;
    elCoord.textContent = it.coord;
    elN.textContent = String(cur + 1);
    var label = 'Photo ' + (cur + 1) + ' of ' + total + ': ' + it.place;
    elTitle.textContent = label;
    if (announce) elLive.textContent = label;

    preload(cur + 1);
    preload(cur - 1);
  }

  function open(i) {
    elLive.textContent = '';
    show(i, false);
    dlg.showModal();
    btnClose.focus();
  }

  links.forEach(function (a, i) {
    a.addEventListener('click', function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      open(i);
    });
  });

  // Focus returns to the photo that was last on screen (the one that opened the viewer if none was changed).
  function returnFocus() {
    var a = items[cur] && items[cur].link;
    if (a && document.activeElement !== a) a.focus();
  }
  function closeViewer() {
    if (!dlg.open) return;
    dlg.close();
    returnFocus();
  }

  btnClose.addEventListener('click', closeViewer);
  document.getElementById('v-prev').addEventListener('click', function () { show(cur - 1, true); });
  document.getElementById('v-next').addEventListener('click', function () { show(cur + 1, true); });

  dlg.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1, true); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); show(cur + 1, true); }
    else if (e.key === 'Home') { e.preventDefault(); show(0, true); }
    else if (e.key === 'End') { e.preventDefault(); show(total - 1, true); }
  });

  // A click on the empty space around the photo closes the viewer.
  dlg.addEventListener('click', function (e) {
    if (e.target === dlg || e.target === stage) closeViewer();
  });

  // Esc closes natively; this also covers any other way the dialog gets closed.
  dlg.addEventListener('close', function () {
    elLive.textContent = '';
    returnFocus();
  });

  // Optional swipe on touch screens.
  var sx = 0, sy = 0, tracking = false;
  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    tracking = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1), true);
  }, { passive: true });
})();
</script>

<script>
/* Globe: a flight driven by the scroll position. Progress p runs from 0 (the plane parked in Korea, until the
   globe has settled under the masthead) to 9; p = k when photo k's centre crosses the middle of the part of the
   screen the photos scroll in (under the masthead, and under the globe band on phones). Between two photos p is
   linear in the scroll position, and inside each leg the plane eases out of one city and into the next along
   the great circle. Korea -> Helsinki gets the longest stretch of scroll; photo 01 waits at the bottom of the
   screen meanwhile. The globe turns so the plane stays near the centre (the camera trails it a little mid-leg)
   and its zoom is set per city, wide enough to show the leg in and the leg out: the whole globe for Korea ->
   Helsinki, then only ever closer for the short European legs (on a log scale, so it never jumps, and never so
   close that the simplified coastlines turn into long straight strokes). Zoomed in, the map fades into the
   night towards the panel's edges. With reduced motion the view stays on one city and cuts to the next halfway
   along each leg; only the plane and its trail move. The canvas is redrawn only when the scroll position or
   the layout changes (one redraw per animation frame at most); nothing runs at rest. Without d3 or the outline
   data, or on a screen too short for it, the page keeps the plain photo grid. */
(function () {
  'use strict';
  var root = document.documentElement;
  var box = document.getElementById('globe');
  var G = window.GLOBE, d3 = window.d3;
  var canvas = box && box.querySelector('.globe-canvas');
  var ctx = null;
  try { ctx = canvas && canvas.getContext('2d'); } catch (err) { ctx = null; }
  function plain() { root.classList.remove('globe-on'); root.classList.add('no-globe'); }
  if (!box || !ctx || !G || !G.land || !G.stops || !d3 || !d3.geoOrthographic || !d3.geoPath ||
      !d3.geoInterpolate || typeof Path2D !== 'function' || !window.matchMedia) { plain(); return; }

  var PI = Math.PI, HALF_PI = PI / 2, DEG = PI / 180;
  var stick = box.querySelector('.globe-stick');
  var journey = box.parentNode;
  var tag = box.querySelector('.globe-tag'), credit = box.querySelector('.credit');
  var tagN = tag.querySelector('.gt-n'), tagCity = tag.querySelector('.gt-city'), tagCountry = tag.querySelector('.gt-country');
  var mast = document.querySelector('.masthead');
  var list = document.getElementById('photos');
  var bandMQ = window.matchMedia('(max-width: 719px), (max-width: 959px) and (orientation: portrait)');
  var fitMQ = window.matchMedia('(min-height: 540px), (min-width: 720px) and (min-height: 420px)');  // as in <head>
  var calmMQ = window.matchMedia('(prefers-reduced-motion: reduce)');
  // as tall as the small viewport (100svh), so it holds still while a phone's address bar slides in and out
  var probe = document.createElement('div');
  probe.setAttribute('aria-hidden', 'true');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:var(--vh100);visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);

  // ---------- route: Korea, then the photos in page order ----------
  var stops = [], places = [], items = [], shots = [];
  G.stops.forEach(function (s) {
    if (s.n === 0) {
      stops.push([s.lon, s.lat]);
      places.push({ n: '', city: s.place, country: '' });
      return;
    }
    var li = document.getElementById('photo-' + s.n);
    if (!li || stops.length !== s.n) return;
    stops.push([s.lon, s.lat]);
    items.push(li);
    shots.push(li.querySelector('.shot'));
    places.push({
      n: (s.n < 10 ? '0' : '') + s.n,
      city: li.querySelector('.city').textContent,
      country: li.querySelector('.country').textContent
    });
  });
  var N = stops.length - 1;
  if (N < 1) { plain(); return; }

  document.getElementById('globe-route').textContent = 'Route: ' + places[0].city + ', then ' +

    var y = window.pageYOffset;
    shots[0].style.position = 'static';
    var rects = shots.map(function (el) { return el.getBoundingClientRect(); });
    var jTop = journey.getBoundingClientRect().top + y;

    var now = heading(L - 1, e), hd = now;
    var kk = Math.round(p), u = p - kk, TURN = 0.2;
    if (kk >= 1 && kk <= N - 1 && Math.abs(u) < TURN) {
      var bl = smooth((u + TURN) / (2 * TURN));
      hd = u < 0 ? lerpAngle(now, heading(kk, 0), bl) : lerpAngle(heading(kk - 1, 1), now, bl);
    }
    var size = band ? 20 : 24;
    ctx.save();
    ctx.translate(pq[0], pq[1]);
    var pg = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 1.15);
    pg.addColorStop(0, GLOW(0.5)); pg.addColorStop(0.45, GLOW(0.16)); pg.addColorStop(1, GLOW(0));
    ctx.fillStyle = pg;
    ctx.fillRect(-size * 1.15, -size * 1.15, size * 2.3, size * 2.3);
    ctx.rotate(hd);
    ctx.scale(size / 24, size / 24);
    ctx.shadowColor = GLOW(0.9);
    ctx.shadowBlur = 6 * dpr;
    ctx.fillStyle = COL.pearl;
    ctx.fill(PLANE);
    ctx.shadowBlur = 0;
    ctx.lineWidth = 0.9; ctx.strokeStyle = COL.pearl; ctx.stroke(PLANE);
    ctx.restore();

    // the label of the city the plane is at or nearest to: on the best side for the landing view that leaves
    // the plane, the route between them and the credit clear; once placed it keeps its side for as long as that
    // stays clear, so it does not hop about; hidden if no side is clear
    if (tgt !== target) setTarget(tgt);
    var shown = false;
    if (tq) {
      var off = labelOff(), R = size * 0.55 + 3;
      if (!rank) rank = rankSides(tgt, off, R);
      var seg = between(plane, stops[tgt], cam);
      var order = curSide ? [curSide] : [];
      for (var ri = 0; ri < rank.length; ri++) if (rank[ri] !== curSide) order.push(rank[ri]);
      for (var pass = 0; pass < 2 && !shown; pass++) {
        for (var oi = 0; oi < order.length; oi++) {
          var raw = tagBox(order[oi], tq[0], tq[1], off);
          if (pass === 0 && overflow(raw) > 28) continue;   // first try sides that need little or no nudging
          var lx = Math.max(6, Math.min(cw - tagW - 6, raw[0])), ly = Math.max(6, Math.min(vis - tagH - 6, raw[1]));
          if (blocked(lx, ly, pq, R, seg)) continue;
          curSide = order[oi]; shown = true;
          tag.style.transform = 'translate3d(' + lx.toFixed(1) + 'px,' + ly.toFixed(1) + 'px,0)';
          break;
        }
      }
    }
    tag.classList.toggle('is-on', shown);
  }

  function frame() {
    raf = 0;
    if (!active) return;
    if (needMeasure) { needMeasure = false; measure(); }
    var y = window.pageYOffset, p = progress(y), v = visibleH(y);
    if (!dirty && Math.abs(p - lastP) < 1e-4 && Math.abs(v - lastVis) < 0.5) return;
    dirty = false;
    lastP = p; lastVis = v; vis = v;
    draw(p);
  }
  function schedule() { if (!raf) raf = window.requestAnimationFrame(frame); }
  function remeasure() { needMeasure = true; schedule(); }
  // the globe only where it fits; elsewhere the plain grid (see <head>)
  function setActive() {
    active = fitMQ.matches;
    root.classList.toggle('globe-on', active);
    root.classList.toggle('no-globe', !active);
    if (!active) {
      items.forEach(function (li) { li.classList.remove('is-current'); });
      target = -1;
      tag.classList.remove('is-on');
    }
    dirty = true;
    remeasure();
  }
  function listen(mq, fn) {
    if (mq.addEventListener) mq.addEventListener('change', fn);
    else if (mq.addListener) mq.addListener(fn);
  }

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', remeasure);
  window.addEventListener('load', remeasure);
  listen(bandMQ, remeasure);
  listen(fitMQ, setActive);
  listen(calmMQ, function () { dirty = true; schedule(); });
  if ('ResizeObserver' in window) {
    var ro = new ResizeObserver(remeasure);
    ro.observe(list); ro.observe(stick); ro.observe(mast);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(remeasure);

  // photo 01 waits at the bottom of the screen during the first flight: reached by keyboard, bring it into place
  list.addEventListener('focusin', function (ev) {
    if (!active || !items[0].contains(ev.target)) return;
    var kb = true;
    try { kb = ev.target.matches(':focus-visible'); } catch (err) { /* old browser: assume keyboard */ }
    if (!kb) return;
    window.setTimeout(function () {
      var b = shots[0].getBoundingClientRect(), top = stickTop + (band ? box.offsetHeight : 0);
      if (b.top < top - 1 || b.bottom > VH + 1) window.scrollTo(0, Math.round(anchors[1]));
    }, 0);
  });

  setActive();
  frame();   // first picture at once, then only on change
  box.classList.add('is-ready');
})();
</script>
</body>
</html>
