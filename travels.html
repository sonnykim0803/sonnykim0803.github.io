<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071020">
<title>Travels · So Yeon Kim</title>
<meta name="description" content="Travels: photographs by So Yeon Kim from Helsinki, Tallinn, Prague, Linz, Budapest, München, Zürich, Geneva and Les Houches.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23071020'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff9a4c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,400..800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..600&display=swap">
<style>
/* Travels: the same night-blue world as the main page, without the landscape. Under the title a map: the
   world (Equal Earth) with the nine places as glowing dots, and a Europe close-up (Lambert azimuthal
   equal-area) where each numbered spot links to its photo. Then an editorial grid of nine photographs
   (3 columns on desktop, 2 on tablets, 1 on phones; the middle column sits a little lower), each captioned
   with the place as on the old site plus its city-centre latitude/longitude. Click a photo to open it full
   size in a native <dialog> viewer. Content is left-aligned on the masthead's edge (as on index.html) and
   capped at --content-max. Map outlines: Natural Earth 1:50m, projected and inlined by
   tools/make_travel_map.py (re-run it after changing the map markup). */
:root{
  color-scheme: dark;
  --ink:#071020;          /* night-blue ground */
  --ink-2:#0b1628;        /* reading panels */
  --line:#1f314c;         /* hairlines */
  --pearl:#e9eef5;        /* text, S1 sheet */
  --mist:#93a7c0;         /* secondary text */
  --faint:#62789a;        /* hairlines, dots, axis lines (not for text) */
  --faint-text:#7d93b2;   /* tertiary text: >= 4.5:1 on ink, ink-2 and dusk */
  --cyan:#7ad8f6;         /* S0 high energy */
  --deep:#0b4a9c;         /* S0 wells */
  --dusk:#172a4b;         /* horizon */
  --glow:#ff9a4c;         /* the wavepacket */
  --glow-core:#fff0dc;    /* hot centre of the packet */
  --coh:#ffe1a6;          /* coherence shimmer */
  --photon:#e8352d;       /* h-nu arrow */
  --spin-up:#8f88ff;      /* spin up, blue-violet */
  --spin-down:#ff9a4c;    /* spin down, orange */
  --bubble:#fbfaf6;
  --bubble-ink:#141b27;
  --shadow:rgba(2,6,14,.45);
  --veil:rgba(7,16,32,.86);
  --hud-bg:rgba(7,16,32,.84);
  --cyan-haze:rgba(122,216,246,.16);
  --glow-haze:rgba(255,154,76,.24);
  --focus:#ffc48f;
  --select:#d3dae4;       /* text selection: light grey */

  --font-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --s-1:clamp(.72rem,.69rem + .14vw,.8rem);
  --s0:clamp(1rem,.95rem + .22vw,1.125rem);
  --s1:clamp(1.15rem,1.04rem + .5vw,1.45rem);
  --s2:clamp(1.95rem,1.3rem + 2.5vw,3.3rem);
  --s3:clamp(3.1rem,1.6rem + 6.4vw,7rem);

  --gx:clamp(16px,5.5vw,88px);

  /* page-only tokens */
  --viewer-bg:#050b17;     /* opaque: nothing of the page shows through behind the photo */
  --viewer-backdrop:rgba(2,6,14,.6);
  --btn-bg:rgba(11,22,40,.72);
  --frame-rim:rgba(233,238,245,.07);
  --col-gap:clamp(20px,2.6vw,40px);
  --stagger:0px;
  --content-max:77rem;
  --mast-h:88px;           /* sticky masthead + its fade: in-page jumps stop below it */

  /* map tokens */
  --land:#0f2039;          /* a step lighter than the ink ground */
  --coast:rgba(122,216,246,.34);  /* cyan-tinted coastline hairline */
  --border-line:#2a4063;   /* country borders on the close-up */
  --rim:rgba(255,154,76,.6);      /* the close-up's frame and its footprint on the world map */
  --tip-bg:rgba(7,16,32,.94);     /* the caption readout on the close-up */
}
[hidden]{display:none!important}
html{overflow-x:clip;background:var(--ink);scrollbar-gutter:stable;scroll-padding-top:var(--mast-h)}
html:has(dialog[open]){overflow:hidden}
body{margin:0;background:var(--ink);color:var(--pearl);font-family:var(--font-body);font-size:var(--s0);
  line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip;
  min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit;text-decoration-color:var(--faint);text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{text-decoration-color:var(--glow)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
::selection{background:var(--select);color:var(--ink)}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap}

.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 40% at 24% 104%, var(--cyan-haze), transparent 70%),
    linear-gradient(180deg, var(--ink) 0%, var(--ink) 40%, var(--dusk) 160%)}

.skip{position:absolute;left:16px;top:-200px;z-index:20;background:var(--glow);color:var(--ink);
  font:500 .78rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:10px 14px;
  text-decoration:none;border-radius:2px}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 10px)}

/* ---------- masthead (same look as index.html; sticky on an ink ground) ---------- */
.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;flex-wrap:wrap;align-items:baseline;
  justify-content:space-between;gap:6px 20px;padding:18px var(--gx) 16px;background:var(--ink);
  box-shadow:0 calc(-1 * env(safe-area-inset-top,0px)) 0 0 var(--ink)}
.masthead::after{content:"";position:absolute;left:0;right:0;top:100%;height:22px;pointer-events:none;
  background:linear-gradient(180deg,var(--ink) 0%,transparent 100%)}
.brand{font-family:var(--font-display);font-style:italic;font-weight:700;font-stretch:87.5%;font-size:1.06rem;
  letter-spacing:-.005em;text-decoration:none;color:var(--pearl)}
.quick{display:flex;flex-wrap:wrap;gap:4px 18px;font-family:var(--font-display);font-weight:500;font-size:.84rem;
  letter-spacing:.02em}
.quick a{text-decoration:none;color:var(--mist);padding:4px 0;border-bottom:1px solid transparent}
.quick a:hover,.quick a[aria-current="page"]{color:var(--pearl);border-bottom-color:var(--glow)}
/* Travels and LaTex for CBNU are separate pages: a hairline sets them apart from the main-page links */
.quick a:not(.page) + a.page{position:relative;margin-left:10px}
.quick a:not(.page) + a.page::before{content:"";position:absolute;left:-14px;top:50%;width:1px;height:.95em;
  transform:translateY(-50%);background:var(--line)}

/* ---------- page ---------- */
.wrap{position:relative;z-index:1;width:100%;padding-inline:var(--gx);box-sizing:border-box}
/* left edge = the masthead's edge (as on index.html); blocks stop at --content-max on wide screens */
.wrap > *{max-width:var(--content-max)}
main.wrap{flex:1 0 auto}
.intro{padding:clamp(44px,10vh,120px) 0 clamp(22px,3.4vh,36px);border-bottom:1px solid var(--line)}
h1{font-family:var(--font-display);font-style:italic;font-weight:800;font-stretch:87.5%;font-size:var(--s3);
  letter-spacing:-.025em;line-height:.92;margin:0;color:var(--pearl)}

/* ---------- map: world + Europe close-up ---------- */
.atlas{position:relative;margin:clamp(28px,5vh,56px) 0 0;display:grid;grid-template-columns:minmax(0,1fr);
  gap:clamp(14px,3vw,26px);align-items:center}
.map{display:block;width:100%;height:auto;overflow:hidden}
.map .land{fill:var(--land);stroke:var(--coast);stroke-width:.75;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .borders{fill:none;stroke:var(--border-line);stroke-width:.75;stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke}
.map .footprint{fill:rgba(255,154,76,.06);stroke:var(--rim);stroke-width:1;stroke-linejoin:round;
  vector-effect:non-scaling-stroke}
.atlas-world{position:relative;min-width:0}
.wdots{position:absolute;inset:0;pointer-events:none}
.wdot{position:absolute;left:var(--x);top:var(--y);width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;
  background:var(--glow-core);box-shadow:0 0 0 1px rgba(255,154,76,.85),0 0 5px 2px rgba(255,154,76,.5);
  transition:transform .25s,box-shadow .25s}
.wdot.is-hot{transform:scale(1.7);box-shadow:0 0 0 1px var(--glow),0 0 8px 3px rgba(255,154,76,.7)}

/* the close-up's frame has the footprint's colour: the two read as the same area */
.atlas-eu{position:relative;min-width:0;border:1px solid var(--rim);border-radius:2px}
.spots{list-style:none;margin:0;padding:0;position:absolute;inset:0}
.spots > li{position:absolute;left:var(--x);top:var(--y);width:0;height:0}
.spot{position:absolute;left:0;top:0;color:var(--pearl);text-decoration:none;-webkit-tap-highlight-color:transparent}
.spot:focus-visible{outline:none}
/* 24 px touch circle (nudged away from a close neighbour by --hx/--hy, so a tap on either dot of a close pair
   picks that dot); the visible dot is .dot::before, the pulse ring .dot::after */
.hit{position:absolute;left:calc(var(--hx,0px) - 12px);top:calc(var(--hy,0px) - 12px);width:24px;height:24px;border-radius:50%}
.dot,.lead{pointer-events:none}
.dot{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%}
.dot::before{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;
  background:var(--glow-core);box-shadow:0 0 0 1.5px var(--glow),0 0 7px 3px rgba(255,154,76,.5),0 0 20px 6px rgba(255,154,76,.2);
  transition:box-shadow .25s}
.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid var(--glow);opacity:0}
.spot:focus-visible .dot{outline:2px solid var(--focus);outline-offset:0}
.lead{position:absolute;left:0;top:0;width:var(--len);height:1px;margin-top:-.5px;transform-origin:0 50%;
  transform:rotate(var(--ang)) translateX(5px);background:var(--glow);opacity:.55}
/* at rest a plain number with an ink halo; lit, a solid orange box */
.tag{position:absolute;font:500 .66rem/1 var(--font-mono);letter-spacing:.04em;font-variant-numeric:tabular-nums;
  color:var(--mist);background:transparent;border:1px solid transparent;border-radius:2px;
  text-shadow:0 0 3px var(--ink),0 0 3px var(--ink),0 0 1px var(--ink);
  padding:3px 3px 3px 4px;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s}
.tag-n{left:0;bottom:12px;transform:translateX(-50%)}
.tag-s{left:0;top:12px;transform:translateX(-50%)}
.tag-e{left:12px;top:var(--sy,0px);transform:translateY(-50%)}
.tag-w{right:12px;top:var(--sy,0px);transform:translateY(-50%)}
.spot:focus-visible,.spot.is-hot{z-index:3}
.spot:focus-visible .tag,.spot.is-hot .tag{background:var(--glow);border-color:var(--glow);color:var(--ink);text-shadow:none}
.spot:focus-visible .dot::before,.spot.is-hot .dot::before{
  box-shadow:0 0 0 1.5px var(--glow),0 0 9px 4px rgba(255,154,76,.7),0 0 28px 10px rgba(255,154,76,.28)}
/* hover styles only where a real pointer hovers (a phone's first tap then follows the link) */
@media (hover:hover){
  .spot:hover{z-index:3}
  .spot:hover .tag{background:var(--glow);border-color:var(--glow);color:var(--ink);text-shadow:none}
  .spot:hover .dot::before{
    box-shadow:0 0 0 1.5px var(--glow),0 0 9px 4px rgba(255,154,76,.7),0 0 28px 10px rgba(255,154,76,.28)}
}
/* the lit spot's caption, in one fixed slot in the close-up's top-left corner (sea, the Faroes and the Norwegian
   coast; no spot there), so it never covers a spot or a number. It stops short of the 01 / 02 numbers (at 2/3
   across) and puts the country under the city when the close-up is narrow. Filled by the script; it stays while
   the pointer is on the close-up, and Esc hides it. */
.readout{position:absolute;left:8px;top:8px;z-index:4;margin:0;display:flex;align-items:baseline;gap:.5em;
  max-width:calc(66% - 50px);box-sizing:border-box;padding:6px 9px 7px;background:var(--tip-bg);
  border:1px solid var(--line);border-radius:2px;line-height:1;opacity:0;visibility:hidden}
.readout.is-on{opacity:1;visibility:visible}
.ro-place{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px .4em;min-width:0}
.ro-city,.ro-country{white-space:nowrap}
.ro-n{font:500 .66rem/1 var(--font-mono);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--glow)}
.ro-city{font-family:var(--font-display);font-style:italic;font-weight:700;font-stretch:87.5%;font-size:.95rem;
  color:var(--pearl)}
.ro-country{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.04em;color:var(--mist)}

.credit{grid-column:1 / -1;justify-self:end;margin:-6px 0 0;font-family:var(--font-mono);font-size:.64rem;
  letter-spacing:.06em;color:var(--faint-text)}

/* the photo that a hovered/focused spot points at */
.grid > li.is-hot .frame::after{box-shadow:inset 0 0 0 1px var(--glow)}
.grid > li.is-hot .frame img{filter:none}
.grid > li.is-hot .no{color:var(--glow-core);text-shadow:0 0 8px var(--glow)}
/* reached from the map: a brief ring */
.grid > li{scroll-margin-block:16px}
.grid > li:focus{outline:none}
.grid > li:focus-visible .frame{outline:2px solid var(--focus);outline-offset:4px}
.grid > li.is-found .frame::after{box-shadow:inset 0 0 0 2px var(--glow)}

.grid{list-style:none;margin:0;padding:clamp(32px,6vh,64px) 0 var(--stagger);display:grid;
  grid-template-columns:minmax(0,1fr);gap:clamp(40px,5vw,72px) var(--col-gap)}
.grid:focus{outline:none}
.grid > li{min-width:0}
.shot{margin:0}
.frame{display:block;position:relative;overflow:hidden;aspect-ratio:1 / 1;background:var(--ink-2);border-radius:2px;
  color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.frame img{display:block;width:100%;height:100%;max-width:100%;object-fit:cover;
  filter:saturate(.94) brightness(.95);transition:transform .7s cubic-bezier(.2,.7,.2,1),filter .4s}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px var(--frame-rim);transition:box-shadow .3s}
.frame:hover img{transform:scale(1.03);filter:none}
.frame:hover::after{box-shadow:inset 0 0 0 1px var(--glow)}
.frame:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.frame .view{position:absolute;right:10px;bottom:10px;z-index:1;font:500 .64rem/1 var(--font-mono);letter-spacing:.12em;
  text-transform:uppercase;color:var(--pearl);background:var(--hud-bg);padding:6px 8px;border-radius:2px;
  opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.frame:hover .view,.frame:focus-visible .view{opacity:1;transform:none}
@media (hover:none){.frame .view{opacity:.9;transform:none}}

.shot figcaption{margin-top:.9rem}
.place{display:block;line-height:1.2}
.city{font-family:var(--font-display);font-style:italic;font-weight:700;font-stretch:87.5%;font-size:var(--s1);
  letter-spacing:-.005em;color:var(--pearl)}
.country{font-family:var(--font-mono);font-size:.76rem;letter-spacing:.04em;color:var(--mist);white-space:nowrap}
.data{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-top:.55rem;padding-top:.5rem;
  border-top:1px solid var(--line);font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;line-height:1.4}
.coord{color:var(--faint-text)}
.no{color:var(--glow);letter-spacing:.08em}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;margin-top:clamp(64px,10vh,120px);
  padding-top:1rem;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px);border-top:1px solid var(--line);
  font-family:var(--font-mono);font-size:.72rem;color:var(--mist)}
.foot a{color:var(--mist);text-decoration:none}
.foot a:hover{color:var(--pearl);text-decoration:underline;text-decoration-color:var(--glow)}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;
  box-sizing:border-box;background:var(--viewer-bg);color:var(--pearl);overflow:hidden;font-family:var(--font-body);
  --chrome:184px}
.viewer::backdrop{background:var(--viewer-backdrop)}
.viewer[open]{display:grid;grid-template-columns:clamp(60px,7vw,104px) minmax(0,1fr) clamp(60px,7vw,104px);
  grid-template-rows:auto minmax(0,1fr);grid-template-areas:"bar bar bar" "prev stage next";
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px)
          calc(env(safe-area-inset-bottom,0px) + 20px) calc(env(safe-area-inset-left,0px) + 12px)}
.v-bar{grid-area:bar;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:10px}
.v-count{margin:0;padding-left:6px;font-family:var(--font-mono);font-size:.78rem;letter-spacing:.12em;color:var(--mist);
  font-variant-numeric:tabular-nums}
.v-count b{font-weight:500;color:var(--pearl)}
.v-stage{grid-area:stage;margin:0;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px}
.v-stage img{display:block;max-width:100%;height:auto;background:var(--ink-2);border-radius:2px;
  width:min(100%, calc((100vh - var(--chrome)) * var(--ar,1)), var(--nw,1280px));
  width:min(100%, calc((100dvh - var(--chrome)) * var(--ar,1)), var(--nw,1280px))}
.v-cap{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:.25rem 1.1rem;text-align:center;
  max-width:100%}
.v-cap .place{display:inline}
.v-cap .coord{color:var(--faint-text)}
.v-cap .coord{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.v-btn{all:unset;box-sizing:border-box;cursor:pointer;width:46px;height:46px;display:inline-grid;place-items:center;
  border:1px solid var(--line);border-radius:2px;color:var(--pearl);background:var(--btn-bg);
  transition:border-color .2s,color .2s}
.v-btn svg{width:18px;height:18px;display:block}
.v-btn:hover{border-color:var(--glow);color:var(--glow)}
.v-btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.v-prev{grid-area:prev;place-self:center}
.v-next{grid-area:next;place-self:center}

@media (prefers-reduced-motion: no-preference){
  .viewer[open]{animation:v-in .22s ease-out}
  .v-stage img.is-in{animation:v-img .3s ease-out}
  @keyframes v-in{from{opacity:0}to{opacity:1}}
  @keyframes v-img{from{opacity:.15}to{opacity:1}}
  .readout{transition:opacity .16s ease-out,visibility .16s}
  .spot:focus-visible .dot::after,.spot.is-hot .dot::after{animation:ping 1.5s ease-out infinite}
  @media (hover:hover){.spot:hover .dot::after{animation:ping 1.5s ease-out infinite}}
  @keyframes ping{0%{transform:scale(.3);opacity:.95}100%{transform:scale(1.35);opacity:0}}
  .grid > li.is-found .frame{animation:found 1.8s ease-out}
  @keyframes found{0%{box-shadow:0 0 0 0 rgba(255,154,76,.6)}30%{box-shadow:0 0 0 7px rgba(255,154,76,.3)}
    100%{box-shadow:0 0 0 20px rgba(255,154,76,0)}}
}
@media (prefers-reduced-motion: reduce){
  .frame img,.frame::after,.frame .view,.v-btn,.wdot,.tag,.dot::before{transition:none}
  .frame:hover img{transform:none}
  .spot:focus-visible .dot::after,.spot.is-hot .dot::after{opacity:.7;transform:scale(1.05)}
  @media (hover:hover){.spot:hover .dot::after{opacity:.7;transform:scale(1.05)}}
}
/* Windows high contrast: box-shadows and author colours are dropped, so draw the dots in system colours */
@media (forced-colors: active){
  .dot::before,.wdot,.lead{background:CanvasText;forced-color-adjust:none}
  .spot:focus-visible .tag,.spot.is-hot .tag{background:Highlight;border-color:Highlight;color:HighlightText;
    forced-color-adjust:none}
  .map .footprint{stroke:Highlight}
  .atlas-eu{border-color:CanvasText}
}

/* ---------- tablets / desktop ---------- */
@media (min-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));--stagger:clamp(32px,6vw,64px)}
  .grid > li:nth-child(2n){transform:translateY(var(--stagger))}
}
@media (min-width:720px) and (max-width:959px){
  /* tablets: world and close-up side by side at equal widths, so the first photos stay near the first screen */
  .atlas{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px}
}
@media (min-width:960px){
  /* world and close-up side by side, about 3 : 2 */
  .atlas{grid-template-columns:minmax(0,3fr) minmax(0,2fr);column-gap:clamp(36px,4.6vw,72px);row-gap:14px}

}

          <img src="assets/travels/09-les-houches-640.jpg" srcset="assets/travels/09-les-houches-640.jpg 640w, assets/travels/09-les-houches-960.jpg 960w, assets/travels/09-les-houches.jpg 1280w"
               sizes="(min-width: 960px) min(29vw, 400px), (min-width: 560px) 45vw, calc(100vw - 32px)"
               width="640" height="640" loading="lazy" decoding="async"
               alt="Snow-capped mountains above a green valley, a chalet roof in the foreground">
          <span class="vh">, open full size</span><span class="view" aria-hidden="true">View</span>
        </a>
        <figcaption>
          <span class="place" id="place-9"><span class="city">Les Houches,</span> <span class="country">France</span></span>
          <span class="data"><span class="coord">45.89° N, 6.80° E</span><span class="no" aria-hidden="true">09</span></span>

<footer class="wrap">

</footer>

<dialog class="viewer" id="viewer" aria-labelledby="v-title">
  <h2 class="vh" id="v-title">Photo viewer</h2>
  <div class="v-bar">
    <p class="v-count" aria-hidden="true"><b id="v-n">1</b> / <span id="v-total">9</span></p>
    <button type="button" class="v-btn v-close" id="v-close" aria-label="Close viewer">
      <svg viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M3.5 3.5l11 11M14.5 3.5l-11 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <figure class="v-stage" id="v-stage">
    <img id="v-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" width="1280" height="1280" decoding="async">
    <figcaption class="v-cap"><span class="place"><span class="city" id="v-city"></span> <span class="country" id="v-country"></span></span> <span class="coord" id="v-coord"></span></figcaption>
  </figure>
  <button type="button" class="v-btn v-prev" id="v-prev" aria-label="Previous photo">
    <svg viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M11 3.5L5.5 9l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button type="button" class="v-btn v-next" id="v-next" aria-label="Next photo">
    <svg viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M7 3.5L12.5 9 7 14.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <p class="vh" id="v-live" aria-live="polite"></p>
</dialog>

<script>
/* Viewer: a click on a photo opens it full size in a native modal <dialog>. Without JS (or without
   dialog support) the links simply open the full-size image file. */
(function () {
  'use strict';
  var dlg = document.getElementById('viewer');
  if (!dlg || typeof dlg.showModal !== 'function') return;

  var links = Array.prototype.slice.call(document.querySelectorAll('.grid .frame'));
  var img = document.getElementById('v-img');
  var stage = document.getElementById('v-stage');
  var elN = document.getElementById('v-n');
  var elTitle = document.getElementById('v-title');
  var elLive = document.getElementById('v-live');
  var elCity = document.getElementById('v-city');
  var elCountry = document.getElementById('v-country');
  var elCoord = document.getElementById('v-coord');
  var btnClose = document.getElementById('v-close');
  var total = links.length;
  var cur = 0;
  var preloaded = {};

  document.getElementById('v-total').textContent = String(total);

  var items = links.map(function (a) {
    var fig = a.closest('figure');
    var thumb = a.querySelector('img');
    var city = fig.querySelector('.city').textContent;
    var country = fig.querySelector('.country').textContent;
    return {
      link: a,
      thumb: thumb,
      full: a.getAttribute('href'),
      w: Number(a.getAttribute('data-w')) || 1280,
      h: Number(a.getAttribute('data-h')) || 1280,
      alt: thumb.getAttribute('alt') || '',
      city: city,
      country: country,
      place: city + ' ' + country,
      coord: fig.querySelector('.coord').textContent
    };
  });

  function preload(i) {
    var it = items[(i + total) % total];
    if (preloaded[it.full]) return;
    preloaded[it.full] = true;
    var pre = new Image();
    pre.decoding = 'async';
    pre.src = it.full;
  }

  function show(i, announce) {
    cur = (i + total) % total;
    var it = items[cur];
    img.classList.remove('is-in');
    void img.offsetWidth; // restart the fade
    img.classList.add('is-in');
    img.width = it.w;
    img.height = it.h;
    img.style.setProperty('--ar', String(it.w / it.h));
    img.style.setProperty('--nw', it.w + 'px');
    img.alt = it.alt;

    // Show whatever the grid already loaded at once, then swap in the full-size file when it has arrived.
    var shown = it.thumb.currentSrc || '';
    if (shown && shown.indexOf(it.full) === -1 && it.thumb.complete) {
      img.src = shown;
      var hi = new Image();
      hi.decoding = 'async';
      hi.onload = function () { if (items[cur] === it) img.src = it.full; };
      hi.src = it.full;
      preloaded[it.full] = true;
    } else {
      img.src = it.full;
      preloaded[it.full] = true;
    }

    elCity.textContent = it.city;
    elCountry.textContent = it.country;
    elCoord.textContent = it.coord;
    elN.textContent = String(cur + 1);
    var label = 'Photo ' + (cur + 1) + ' of ' + total + ': ' + it.place;
    elTitle.textContent = label;
    if (announce) elLive.textContent = label;

    preload(cur + 1);
    preload(cur - 1);
  }

  function open(i) {
    elLive.textContent = '';
    show(i, false);
    dlg.showModal();
    btnClose.focus();
  }

  links.forEach(function (a, i) {
    a.addEventListener('click', function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      open(i);
    });
  });

  // Focus returns to the photo that was last on screen (the one that opened the viewer if none was changed).
  function returnFocus() {
    var a = items[cur] && items[cur].link;
    if (a && document.activeElement !== a) a.focus();
  }
  function closeViewer() {
    if (!dlg.open) return;
    dlg.close();
    returnFocus();
  }

  btnClose.addEventListener('click', closeViewer);
  document.getElementById('v-prev').addEventListener('click', function () { show(cur - 1, true); });
  document.getElementById('v-next').addEventListener('click', function () { show(cur + 1, true); });

  dlg.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1, true); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); show(cur + 1, true); }
    else if (e.key === 'Home') { e.preventDefault(); show(0, true); }
    else if (e.key === 'End') { e.preventDefault(); show(total - 1, true); }
  });

  // A click on the empty space around the photo closes the viewer.
  dlg.addEventListener('click', function (e) {
    if (e.target === dlg || e.target === stage) closeViewer();
  });

  // Esc closes natively; this also covers any other way the dialog gets closed.
  dlg.addEventListener('close', function () {
    elLive.textContent = '';
    returnFocus();
  });

  // Optional swipe on touch screens.
  var sx = 0, sy = 0, tracking = false;
  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    tracking = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1), true);
  }, { passive: true });
})();

/* Map: each spot on the Europe close-up is a link to its photo. One place is lit at a time: the spot the
   mouse last entered (it stays lit while the pointer is on the close-up), else the spot with keyboard focus,
   else the photo under the mouse or with keyboard focus. The lit place's number turns orange, its caption
   (read from the photo's own caption) shows in the readout in the close-up's corner, its world dot grows and
   its photo gets an orange edge. Esc hides the readout. A click scrolls to the photo (smoothly unless reduced
   motion is asked for) and rings it briefly; it never opens the viewer. A touch tap only follows the link.
   Without JS the spots are plain in-page links. */
(function () {
  'use strict';
  var atlas = document.getElementById('map');
  if (!atlas) return;
  var panel = atlas.querySelector('.atlas-eu');
  var out = document.getElementById('map-readout');
  var dlg = document.getElementById('viewer');
  var reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  var spots = {}, wdots = {}, photos = {}, keys = [];
  var hoverN = null;   // the spot the mouse last entered, while the pointer is on the close-up
  var photoN = null;   // the photo under the mouse
  var litN = null, dismissed = false;

  Array.prototype.forEach.call(atlas.querySelectorAll('.spot'), function (a) {
    var n = a.getAttribute('data-n');
    spots[n] = a;
    keys.push(n);
  });
  Array.prototype.forEach.call(atlas.querySelectorAll('.wdot'), function (d) { wdots[d.getAttribute('data-n')] = d; });
  keys.forEach(function (n) { photos[n] = document.getElementById('photo-' + n); });

  function byKeyboard(el) { try { return el.matches(':focus-visible'); } catch (e) { return true; } }
  function focusedN() {
    var el = document.activeElement;
    if (!el || el === document.body) return null;
    for (var i = 0; i < keys.length; i++) {
      var n = keys[i], li = photos[n];
      if (el === spots[n]) return byKeyboard(el) ? n : null;
      // a photo counts when focus is inside it, or on the item itself after a keyboard jump from the map
      // (a mouse click on the caption text also focuses the item; that does not light the map)
      if (li && li.contains(el) && (el !== li || byKeyboard(li))) return n;
    }
    return null;
  }

  function update() {
    var n = hoverN || focusedN() || photoN;
    if (n !== litN) dismissed = false;
    litN = n;
    keys.forEach(function (m) {
      var on = m === n;
      spots[m].classList.toggle('is-hot', on);
      if (photos[m]) photos[m].classList.toggle('is-hot', on);
      if (wdots[m]) wdots[m].classList.toggle('is-hot', on);
    });
    if (!out) return;
    if (n && photos[n]) {
      var place = photos[n].querySelector('.place');
      out.querySelector('.ro-n').textContent = (n.length < 2 ? '0' : '') + n;
      out.querySelector('.ro-city').textContent = place.querySelector('.city').textContent;
      out.querySelector('.ro-country').textContent = place.querySelector('.country').textContent;
    }
    out.classList.toggle('is-on', !!n && !dismissed);
  }
  function isMouse(e) { return e.pointerType === 'mouse' || e.pointerType === 'pen'; }

  keys.forEach(function (n) {
    var a = spots[n], li = photos[n];
    a.addEventListener('pointerenter', function (e) { if (isMouse(e)) { hoverN = n; update(); } });
    if (li) {
      li.addEventListener('pointerenter', function (e) { if (isMouse(e)) { photoN = n; update(); } });
      li.addEventListener('pointerleave', function () { if (photoN === n) { photoN = null; update(); } });
    }

    a.addEventListener('click', function (e) {
      if (!li || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      li.scrollIntoView({ behavior: reduce.matches ? 'auto' : 'smooth', block: 'center' });
      li.focus({ preventScroll: true });
      li.classList.remove('is-found');
      void li.offsetWidth; // restart the ring
      li.classList.add('is-found');
      clearTimeout(li._found);
      li._found = setTimeout(function () { li.classList.remove('is-found'); }, 1800);
    });
  });
  if (panel) panel.addEventListener('pointerleave', function () { hoverN = null; update(); });
  document.addEventListener('focusin', update);
  document.addEventListener('focusout', function () { setTimeout(update, 0); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || e.defaultPrevented || (dlg && dlg.open) || !litN || dismissed) return;
    dismissed = true;
    if (out) out.classList.remove('is-on');
  });
})();
</script>
</body>
